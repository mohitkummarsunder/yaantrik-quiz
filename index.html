<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaantrik Automobile Quiz</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--n:#0b1425;--g:#f0be1e;--r:#d9503f;--o:#ff7a2b;--b:#2b6cd9;--gr:#2a9d6b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--n);color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;color:var(--n);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px;border-bottom:5px solid var(--g)}
header img{height:48px}header b{font-size:clamp(13px,2vw,22px);text-align:center}
main{flex:1;padding:20px;max-width:1200px;width:100%;margin:auto}
h1{font-size:clamp(24px,4vw,44px);margin:.3em 0}
button,input{font:inherit;border:0;border-radius:12px;padding:14px 22px}button{font-weight:700;cursor:pointer;background:var(--g);color:var(--n)}
input{display:block;width:100%;margin:10px 0;color:var(--n);font-size:1.2em}
.card{max-width:520px;margin:auto;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}@media(max-width:700px){.opts{grid-template-columns:1fr}}
.o{padding:18px;border-radius:14px;font-size:clamp(16px,2.2vw,26px);font-weight:700;color:#fff;text-align:left}
.o0{background:var(--r)}.o1{background:var(--b)}.o2{background:var(--g);color:var(--n)}.o3{background:var(--gr)}
.dim{opacity:.3}.ok{outline:6px solid #fff}
.bar{height:12px;background:#ffffff33;border-radius:9px;overflow:hidden;flex:1}.bar i{display:block;height:100%;width:100%;background:var(--o);transition:width .3s}
.row{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:1.4em}.row .bar{height:34px}
.chip{display:inline-block;background:#ffffff1f;padding:6px 12px;border-radius:20px;margin:4px}
.lbr{display:flex;justify-content:space-between;background:#ffffff14;padding:8px 16px;margin:5px 0;border-radius:10px;font-size:1.3em}
</style></head><body>

ke", "Intake stroke", "Compression stroke"], "a": 2}, {"q": "Which stroke produces useful power in a four-stroke engine?", "o": ["Exhaust stroke", "Power stroke", "Intake stroke", "Compression stroke"], "a": 1}, {"q": "Which stroke removes burnt gases from the cylinder?", "o": ["Power stroke", "Intake stroke", "Compression stroke", "Exhaust stroke"], "a": 3}, {"q": "During which stroke is the mixture compressed?", "o": ["Power stroke", "Exhaust stroke", "Compression stroke", "Intake stroke"], "a": 2}, {"q": "What is the purpose of an exhaust system?", "o": ["Store electricity", "Carry and treat exhaust gases", "Supply engine oil", "Increase tyre pressure"], "a": 1}, {"q": "Which component reduces exhaust noise?", "o": ["Muffler/Silencer", "Clutch", "Alternator", "Piston"], "a": 0}, {"q": "What is the function of a catalytic converter?", "o": ["Improve tyre grip", "Store fuel", "Reduce harmful exhaust emissions", "Increase engine oil level"], "a": 2}, {"q": "What does EV stand for?", "o": ["Engine Vehicle", "Energy Valve", "Electronic Vent", "Electric Vehicle"], "a": 3}, {"q": "What is the main energy source for a battery electric vehicle?", "o": ["Steam boiler", "Rechargeable battery", "Petrol tank", "Diesel tank"], "a": 1}, {"q": "Which motor is commonly used to drive many electric vehicles?", "o": ["Electric traction motor", "Steam turbine", "Petrol engine only", "Hydraulic pump only"], "a": 0}, {"q": "What is regenerative braking?", "o": ["Recovering some braking energy as electrical energy", "Increasing brake pad wear", "Using fuel during braking", "Cooling the tyres"], "a": 0}, {"q": "What is a hybrid vehicle?", "o": ["A vehicle with two steering wheels", "A vehicle with two radiators only", "A vehicle with two fuel tanks only", "A vehicle using two or more types of propulsion systems"], "a": 3}, {"q": "What does RPM measure?", "o": ["Tyre pressure", "Engine temperature", "Rotational speed", "Fuel density"], "a": 2}, {"q": "What does km/h measure?", "o": ["Battery voltage", "Vehicle speed", "Engine torque", "Fuel consumption"], "a": 1}, {"q": "What is torque?", "o": ["Vehicle mass only", "Engine temperature", "Fuel volume", "Turning moment or twisting force"], "a": 3}, {"q": "Which unit is commonly used for engine power?", "o": ["litre", "bar only", "kW", "kg"], "a": 2}, {"q": "Which unit is commonly used for tyre pressure?", "o": ["litre", "bar or psi", "kW", "rpm"], "a": 1}, {"q": "What is wheel alignment?", "o": ["Correct positioning of the wheels relative to the vehicle", "Cleaning the wheels", "Inflating the tyres", "Painting the wheels"], "a": 0}, {"q": "What is wheel balancing?", "o": ["Changing brake fluid", "Adjusting fuel injection", "Distributing wheel and tyre mass evenly", "Increasing engine power"], "a": 2}, {"q": "What is preventive maintenance?", "o": ["Repairing only after complete failure", "Driving without inspection", "Removing safety systems", "Regular servicing to avoid failures"], "a": 3}, {"q": "Which instrument displays vehicle speed to the driver?", "o": ["Fuel gauge", "Speedometer", "Tachometer", "Odometer"], "a": 1}, {"q": "Which instrument indicates engine rotational speed?", "o": ["Tachometer", "Speedometer", "Odometer", "Fuel gauge"], "a": 0}];
const POLL=["Audi","BMW","Mercedes-Benz","Something else"],T=20;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isHost=new URLSearchParams(location.search).has('host');
const sb=CFG.URL.includes('PASTE')?null:supabase.createClient(CFG.URL,CFG.KEY);
let ch,H,me,S={},my={},K;
const send=(e,p)=>ch.send({type:'broadcast',event:e,payload:p});
const top=n=>Object.values(H.pl).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>[x.n,x.s]);

/* ---------- HOST ---------- */
function hostBoot(){const sv=localStorage.yqH;
 app.innerHTML=`<h1>Host panel</h1><p>Pick a round to create a room:</p><button onclick="hostStart(30)">Quick round · 30 questions</button> <button onclick="hostStart(60)">Full round · 60 questions</button>${sv?`<p><button onclick="hostStart(0)">Resume last room (${JSON.parse(sv).code})</button></p>`:''}`}
function hostStart(n){
 H=n?{code:Math.random().toString(36).slice(2,7).toUpperCase(),qs:n==30?Q.filter((_,i)=>i%2==0):Q,ph:'lobby',qi:-1,pl:{},votes:{},ans:{},end:0,pt:{}}:JSON.parse(localStorage.yqH);
 ch=sb.channel('room-'+H.code);
 ch.on('broadcast',{event:'join'},({payload:p})=>{
  if(Object.entries(H.pl).some(([i,x])=>x.n.toLowerCase()==p.n.toLowerCase()&&i!=p.id))return send('deny',{id:p.id});
  if(!H.pl[p.id]){H.pl[p.id]={n:p.n,s:0};upd()}})
 .on('broadcast',{event:'vote'},({payload:p})=>{if(H.ph=='poll'&&H.pl[p.id]&&!(p.id in H.votes)){H.votes[p.id]=p.c;upd()}})
 .on('broadcast',{event:'ans'},({payload:p})=>{if(H.ph=='question'&&p.qi==H.qi&&H.pl[p.id]&&!H.ans[p.id]){
  H.ans[p.id]={c:p.c,l:Math.max(0,H.end-Date.now())};upd();if(Object.keys(H.ans).length>=Object.keys(H.pl).length)reveal()}})
 .subscribe();
 setInterval(pub,2000);setInterval(tick,250);upd()}
function snap(){const q=H.qs[H.qi],r=H.ph=='reveal'||H.ph=='final';
 return{ph:H.ph,qi:H.qi,n:H.qs.length,q:q&&q.q,o:q&&q.o,a:r&&q?q.a:null,left:Math.max(0,H.end-Date.now()),
 pl:Object.keys(H.pl),got:Object.keys(H.ph=='poll'?H.votes:H.ans),sc:r?Object.fromEntries(Object.entries(H.pl).map(([i,x])=>[i,x.s])):null,pt:r?H.pt:{}}}
function pub(){send('s',snap())}
function upd(){localStorage.yqH=JSON.stringify(H);render();pub()}
function tick(){if(H.ph!='question')return;const l=Math.max(0,H.end-Date.now()),b=$('#bar');
 if(b){b.style.width=l/T/10+'%';$('#cnt').textContent=Math.ceil(l/1000)}if(l<=0)reveal()}
function reveal(){if(H.ph!='question')return;const q=H.qs[H.qi];H.pt={};
 for(const[i,a]of Object.entries(H.ans)){const p=a.c==q.a?500+Math.round(500*a.l/(T*1000)):0;H.pt[i]=p;H.pl[i].s+=p}
 H.ph='reveal';upd()}
function next(){const p=H.ph;
 if(p=='lobby')H.ph='poll';else if(p=='poll')H.ph='bridge';
 else if(p=='bridge'||p=='reveal'){if(H.qi+1>=H.qs.length)H.ph='final';else{H.qi++;H.ans={};H.pt={};H.ph='question';H.end=Date.now()+T*1000}}
 else if(p=='question')return reveal();else return;
 upd()}
function render(){const np=Object.keys(H.pl).length,q=H.qs[H.qi],btn=t=>`<p><button onclick="next()" style="font-size:1.3em">${t} →</button></p>`;let h='',u='';
 if(H.ph=='lobby'){u=location.origin+location.pathname+'?room='+H.code;
  h=`<div style="display:flex;gap:30px;flex-wrap:wrap;align-items:center"><div id=qr style="background:#fff;padding:12px;border-radius:12px"></div><div><h2>Scan or open</h2><p style="word-break:break-all;font-size:1.2em">${u}</p><h2>Room code</h2><div style="font-size:clamp(48px,9vw,110px);font-weight:900;color:var(--g);letter-spacing:.1em">${H.code}</div></div></div><h2>${np} joined</h2>${Object.values(H.pl).map(x=>`<span class=chip>${esc(x.n)}</span>`).join('')}${btn('Start poll')}`}
 else if(H.ph=='poll'||H.ph=='bridge'){const c=POLL.map((_,i)=>Object.values(H.votes).filter(v=>v==i).length),m=Math.max(1,...c);
  h=H.ph=='poll'?`<h1>What's your favourite car brand?</h1>`+POLL.map((p,i)=>`<div class=row><span style="width:230px">${p}</span><div class=bar><i style="width:${c[i]/m*100}%"></i></div><b>${c[i]}</b></div>`).join('')+`<p>${Object.keys(H.votes).length}/${np} voted</p>`+btn('Continue')
  :`<h1 style="color:var(--g);margin-top:80px">Good to see so much love for the finished product… 🚗</h1><h1>But what about the <u>million parts</u> working in harmony? ⚙️</h1>`+btn('Start the quiz')}
 else if(H.ph=='question'||H.ph=='reveal'){const rv=H.ph=='reveal',c=q.o.map((_,i)=>Object.values(H.ans).filter(a=>a.c==i).length);
  h=`<div style="display:flex;justify-content:space-between"><span>Question ${H.qi+1} / ${H.qs.length}</span>${rv?'':`<b id=cnt style="font-size:2em">${T}</b>`}</div>${rv?'':'<div style="display:flex"><div class=bar><i id=bar></i></div></div>'}<h1>${esc(q.q)}</h1><div class=opts>${q.o.map((o,i)=>`<div class="o o${i} ${rv&&i!=q.a?'dim':''} ${rv&&i==q.a?'ok':''}">${'ABCD'[i]}. ${esc(o)}${rv?` <b style="float:right">${c[i]}</b>`:''}</div>`).join('')}</div>`+
  (rv?`<h2>Leaderboard</h2>${top(5).map((x,i)=>`<div class=lbr><span>${i+1}. ${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')}${btn(H.qi+1>=H.qs.length?'Final results':'Next question')}`:`<p>${Object.keys(H.ans).length}/${np} answered</p>${btn('Skip to answer')}`)}
 else{const t=top(10);
  h=`<h1 style="text-align:center">🏆 Final Leaderboard</h1><div style="display:flex;align-items:flex-end;gap:10px;margin:30px 0">`+[1,0,2].map(i=>t[i]?`<div style="text-align:center;flex:1"><div style="font-size:1.6em">${esc(t[i][0])}</div><div style="background:${['var(--g)','#c0c0c0','#cd7f32'][i]};color:var(--n);height:${[260,190,140][i]}px;border-radius:12px 12px 0 0;font-size:3em;font-weight:900;padding-top:10px">${i+1}<div style="font-size:.4em">${t[i][1]} pts</div></div></div>`:'').join('')+`</div>`+t.slice(3).map((x,i)=>`<div class=lbr><span>${i+4}. ${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')}
 app.innerHTML=h;if(u)new QRCode($('#qr'),{text:u,width:220,height:220})}
document.onkeydown=e=>{if(isHost&&H&&['ArrowRight','PageDown'].includes(e.key))next()};

/* ---------- PARTICIPANT ---------- */
function pBoot(){const sv=JSON.parse(localStorage.yqP||'null'),rm=new URLSearchParams(location.search).get('room');
 if(sv&&(!rm||rm.toUpperCase()==sv.code)){me=sv;return pConn()}
 app.innerHTML=`<div class=card><h1>Join the quiz</h1><input id=c placeholder="Room code" value="${esc(rm||'')}" maxlength=5><input id=nm placeholder="Your nickname" maxlength=16><button onclick="pJoin()">Join</button><p id=er></p></div>`}
function pJoin(){const c=$('#c').value.trim().toUpperCase(),n=$('#nm').value.trim();if(!c||!n)return;
 me={id:Math.random().toString(36).slice(2,8),code:c,n};localStorage.yqP=JSON.stringify(me);pConn()}
function pConn(){app.innerHTML='<div class=card><h2>Connecting…</h2></div>';
 ch=sb.channel('room-'+me.code);
 ch.on('broadcast',{event:'s'},({payload:p})=>pGot(p))
 .on('broadcast',{event:'deny'},({payload:p})=>{if(me&&p.id==me.id){me=null;delete localStorage.yqP;sb.removeChannel(ch);pBoot();$('#er').textContent='That nickname is taken. Pick another.'}})
 .subscribe(s=>{if(s=='SUBSCRIBED')send('join',{id:me.id,n:me.n})});
 setInterval(()=>{const b=$('#bar');if(b&&S.ph=='question')b.style.width=Math.max(0,(S.t-Date.now())/T/10)+'%'},250)}
function pGot(p){if(!me)return;S=p;S.t=Date.now()+p.left;const m=my[p.ph+p.qi];
 if(!p.pl.includes(me.id))send('join',{id:me.id,n:me.n});
 if(m!=null&&!p.got.includes(me.id)&&(p.ph=='poll'||p.ph=='question'))send(p.ph=='poll'?'vote':'ans',{id:me.id,c:m,qi:p.qi});
 const k=p.ph+'|'+p.qi+'|'+(m!=null);if(k!=K){K=k;pRender()}}
function pick(i){if(S.ph=='question'&&Date.now()>S.t)return;my[S.ph+S.qi]=i;send(S.ph=='poll'?'vote':'ans',{id:me.id,c:i,qi:S.qi});K=null;pGot(S)}
function pRender(){const p=S,mine=my[p.ph+p.qi];let h='';
 if(p.ph=='lobby')h=`<h1>You're in, ${esc(me.n)}! 🎉</h1><p>Watch the big screen. The quiz starts soon.</p>`;
 else if(p.ph=='poll')h=`<h2>Your favourite car brand?</h2>`+(mine!=null?`<h1>Vote locked ✔</h1>`:`<div class=opts>${POLL.map((o,i)=>`<button class="o o${i}" onclick="pick(${i})">${o}</button>`).join('')}</div>`);
 else if(p.ph=='bridge')h=`<h1>🚗 → ⚙️</h1><h2>A million parts, working in harmony…</h2>`;
 else if(p.ph=='question')h=`<div style="display:flex"><div class=bar><i id=bar></i></div></div><p>Q${p.qi+1}/${p.n}</p><h2>${esc(p.q)}</h2>`+(mine!=null?`<h1>Answer locked ✔</h1><p>Wait for the reveal…</p>`:`<div class=opts>${p.o.map((o,i)=>`<button class="o o${i}" onclick="pick(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>`);
 else{const a=my['question'+p.qi],s=(p.sc||{})[me.id]||0,rk=1+Object.values(p.sc||{}).filter(v=>v>s).length;
  h=(p.ph=='final'?'<h1>🏁 Final result</h1>':a==null?'<h1>⏰ No answer</h1>':a==p.a?`<h1 style="color:#5ee0a0">Correct! +${p.pt[me.id]||0}</h1>`:'<h1 style="color:#ff8a7a">Not quite</h1>')+`<h2>${s} pts · Rank #${rk} of ${p.pl.length}</h2>`+(p.ph=='reveal'?`<p>Answer: ${'ABCD'[p.a]}. ${esc(p.o[p.a])}</p>`:'')}
 app.innerHTML=`<div class=card>${h}</div>`}

if(!sb)app.innerHTML='<h1>Setup needed</h1><p>Open index.html and paste your Supabase URL and anon key into CFG at the top of the script.</p>';
else isHost?hostBoot():pBoot();
</script></body></html>
